[package]
name = "fhre_rs_demo"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fhre_rs_demo"
path = "src/lib.rs"
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 'z'

[dependencies]
fhre = { path = "../../../../apps/fhre/rust", default-features = false }
libm = "0.2"

[features]
default = ["cube"]
cube = ["fhre/cube"]

